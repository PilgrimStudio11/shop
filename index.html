<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Star Nomad — Планеты и доход</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { background: #03050b; font-family: 'Courier New', 'Fira Code', monospace; margin: 0; padding: 20px; color: white; }
        .game-container { max-width: 1100px; margin: 0 auto; background: #0a0f1ae6; backdrop-filter: blur(2px); border: 1px solid #2c4a6e; border-radius: 32px; overflow: hidden; }
        button { background: #152635; border: none; font-family: inherit; font-weight: bold; padding: 8px 20px; border-radius: 60px; color: white; font-size: 14px; cursor: pointer; transition: 0.1s; border: 1px solid #2e6f97; margin: 4px; }
        button:hover { background: #1d3f5a; transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .header { background: #071524; padding: 12px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; border-bottom: 1px solid #1f4970; font-weight: bold; }
        .stat { background: #0a111f; padding: 5px 14px; border-radius: 32px; font-size: 13px; }
        .stat span { color: #ffcf6e; }
        .cargo-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; justify-content: center; background: #03070faa; padding: 6px; border-radius: 40px; }
        .cargo-item { background: #07121f; padding: 3px 12px; border-radius: 40px; font-size: 12px; }
        .main-area { padding: 20px; }
        .planet-card { background: #07121faa; border-radius: 28px; padding: 20px; text-align: center; border: 1px solid #2a577a; cursor: pointer; transition: 0.1s; margin-bottom: 20px; }
        .planet-card:hover { background: #0f2638; transform: scale(1.01); }
        .planet-name { font-size: 28px; font-weight: bold; }
        .nav-buttons { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .hyper-buttons { display: flex; justify-content: center; gap: 20px; margin: 10px 0; }
        .log-box { background: #02070f; border-radius: 24px; height: 200px; overflow-y: auto; padding: 12px; font-size: 13px; border: 1px solid #1f4868; color: #c2dcff; }
        .log-entry { margin-bottom: 6px; border-left: 3px solid #2d7f9e; padding-left: 10px; }
        .log-entry.combat { border-left-color: #e06c5e; color: #ffc5b8; }
        .log-entry.success { border-left-color: #6fcf97; }
        .log-entry.warning { border-left-color: #f2c94c; }
        .log-entry.mission { border-left-color: #f0a3ff; color: #f0d4ff; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #0f1a2c; border-radius: 32px; padding: 25px; max-width: 800px; width: 90%; border: 1px solid #5a9fd0; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-top: 0; }
        .modal-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
        .trade-row { display: flex; flex-wrap: wrap; gap: 15px; margin: 15px 0; }
        .trade-item { background: #03070f; border-radius: 20px; padding: 10px; flex: 1; min-width: 150px; }
        .trade-item input { width: 80px; background: #1f2a3a; border: 1px solid #4a7a9a; color: white; border-radius: 20px; padding: 5px; text-align: center; }
        .hidden { display: none; }
        .shop-item { background: #07121f; border-radius: 20px; padding: 12px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .mission-panel { margin-bottom: 15px; background: #07121faa; border-radius: 28px; padding: 10px; text-align: center; }
        #rankingList table { width: 100%; border-collapse: collapse; color: #eee; }
        #rankingList th, #rankingList td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #2a577a; }
        #rankingList th { background: #0a1a2a; font-weight: bold; }
        #rankingList tr:hover { background: #0f2638; }
        .dock-panel { background: #03070fcc; border-radius: 28px; padding: 20px; text-align: center; }
        .dock-header { font-size: 24px; margin-bottom: 20px; color: #6fcf97; }
        .dock-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        .dock-log { background: #02070f; border-radius: 24px; height: 150px; overflow-y: auto; padding: 12px; font-size: 12px; border: 1px solid #1f4868; color: #c2dcff; text-align: left; margin-top: 15px; }
        .dock-log .log-entry { margin-bottom: 4px; border-left: 2px solid #2d7f9e; }
        .menu-log { margin-top: 20px; background: #02070f; border-radius: 24px; height: 150px; overflow-y: auto; padding: 12px; font-size: 12px; border: 1px solid #1f4868; color: #c2dcff; }
        .menu-log .log-entry { margin-bottom: 4px; border-left: 2px solid #2d7f9e; }
    </style>
</head>
<body>
<div id="app">
    <div id="menuScreen" style="padding: 20px;">
        <h1 style="text-align:center">⭐ STAR NOMAD ⭐</h1>
        <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin: 30px 0;">
            <button id="continueBtn">▶ ПРОДОЛЖИТЬ</button>
            <button id="newGameBtn">🆕 НОВАЯ ИГРА</button>
            <button id="shopBtn">🛸 КОРАБЛИ</button>
            <button id="rankingBtn">🏆 РЕЙТИНГ</button>
            <button id="exportBtn">💾 ЭКСПОРТ</button>
            <button id="importBtn">📂 ИМПОРТ</button>
            <button id="exitBtn">❌ ВЫХОД</button>
        </div>
        <div id="rankingPanel" class="hidden" style="background: #03070faa; border-radius: 24px; padding: 15px;">
            <h3>Рейтинг пилотов</h3>
            <div id="rankingList"></div>
        </div>
        <div id="shopPanel" class="hidden" style="background: #03070faa; border-radius: 24px; padding: 15px;">
            <h3>🛸 Корабли</h3>
            <div id="shopList"></div>
            <h3>🔧 Модули</h3>
            <div id="modulesList"></div>
            <div class="modal-buttons"><button id="closeShopBtn">Закрыть</button></div>
        </div>
        <div class="menu-log" id="menuLogBox">
            <div class="log-entry">⚡ Система готова. Нажмите «Продолжить».</div>
        </div>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="header">
            <div class="stat">🛸 <span id="shipName">Странник</span></div>
            <div class="stat">⚡ СИЛА: <span id="powerVal">0</span></div>
            <div class="stat">🛡️ ПРОЧНОСТЬ: <span id="hullVal">0</span>%</div>
            <div class="stat">💰 КРЕДИТЫ: <span id="creditsVal">0</span></div>
            <div class="stat">⛽ ТОПЛИВО: <span id="fuelVal">0</span>/<span id="maxFuelVal">100</span></div>
            <div class="stat">🌀 СС: <span id="strangePowerVal">0</span></div>
            <div class="stat">🌑 ТМ: <span id="darkMatterVal">0</span></div>
            <div class="stat">⭐ УРОВЕНЬ: <span id="levelVal">1</span> | 🏆 ПОБЕД: <span id="winsVal">0</span></div>
        </div>
        <div class="cargo-row" id="cargoDisplay"></div>
        <div class="main-area">
            <div class="mission-panel" id="missionPanel"><span id="missionText">Нет активного задания</span></div>
            <div class="planet-card" id="currentPlanetCard"><div class="planet-name" id="currentPlanetName">Планета #?</div><div>🔄 нажми, чтобы открыть</div></div>
            <div class="nav-buttons"><button id="leftBtn">◀ ЛЕВО</button><button id="rightBtn">ПРАВО ▶</button></div>
            <div class="hyper-buttons"><button id="hyperLeftBtn">⬅️⬅️⬅️ ГИПЕР ЛЕВО</button><button id="hyperRightBtn">ГИПЕР ПРАВО ➡️➡️➡️</button></div>
            <div style="display: flex; justify-content: center; margin: 10px 0;"><button id="dockBtn">🚀 ДОК (100 СС)</button></div>
            <div class="log-box" id="logBox"><div class="log-entry">⚡ Добро пожаловать, капитан.</div></div>
            <div style="margin-top: 15px; display: flex; justify-content: center;"><button id="menuBtn">🏠 ГЛАВНОЕ МЕНЮ</button></div>
        </div>
    </div>
</div>

<script>
    // ------------------- КОНФИГ -------------------
    const PLANET_COUNT = 1000;
    const FUEL_PRICE = 2;
    const START_CREDITS = 3000;
    const START_STRANGE_POWER = 100;
    const HYPER_COST = 50;
    const DARK_MATTER_CHANCE = 0.1;
    const DARK_MATTER_AMOUNT = [2,5];
    const BOT_MOVE_INTERVAL_MS = 10000;
    const BOT_CREATE_INTERVAL_MS = 5 * 60 * 1000;
    const PRICE_REFRESH_INTERVAL_MS = 30 * 60 * 1000;
    const MISSION_REFRESH_INTERVAL_MS = 30 * 60 * 1000;
    const IMMUNITY_DURATION = 30 * 60 * 1000;
    const MODULE_HARVESTER_COST = 50000;
    const DOCK_COST = 100;
    const DOCK_DURATION_MS = 24 * 60 * 60 * 1000;
    const MAX_OFFLINE_HOURS = 12;

    const GOODS = [
        { id: "gold", name: "Золото", baseBuy: 100, baseSell: 100, spread: 30, cargoSpace: 1, rocket: false },
        { id: "slaves", name: "Рабы", baseBuy: 80, baseSell: 80, spread: 25, cargoSpace: 1, rocket: false },
        { id: "food", name: "Продукты", baseBuy: 40, baseSell: 40, spread: 15, cargoSpace: 1, rocket: false },
        { id: "rockets", name: "Ракеты", baseBuy: 200, baseSell: 200, spread: 50, cargoSpace: 5, rocket: true },
        { id: "oil", name: "Нефть", baseBuy: 60, baseSell: 60, spread: 20, cargoSpace: 1, rocket: false }
    ];

    function generateShips() {
        const ships = [];
        for (let i = 1; i <= 21; i++) {
            let power = 20 * Math.pow(2, i-1);
            let cargo = 100 * Math.pow(2, i-1);
            let fuelCap = 100 * Math.pow(2, i-1);
            let cost = 50000 * Math.pow(2, i-1);
            if (i === 1) cost = 50000;
            ships.push({ level: i, name: "", power: power, cargo: cargo, fuelCap: fuelCap, cost: cost });
        }
        const names = ["Странник", "Искатель", "Пилигрим", "Компас", "Орион", "Вега", "Сириус", "Альтаир", "Поллукс", "Регул", "Денеб", "Антарес", "Бетельгейзе", "Ригель", "Канопус", "Ахернар", "Альдебаран", "Поларис", "Вега-2", "Солнцестояние", "Галактика"];
        for (let i = 0; i < ships.length; i++) ships[i].name = names[i];
        return ships;
    }
    const SHIPS = generateShips();
    function getShip(level) { return SHIPS[Math.min(level-1, 20)]; }

    // Состояние планет
    let planets = [];
    function initPlanets() {
        for (let i = 0; i < PLANET_COUNT; i++) {
            planets.push({ owner: null, modules: { teleport: false, tm: false }, income: { total: 0, lastCollect: Date.now() }, buyCount: 0 });
        }
    }

    let player = {
        credits: START_CREDITS, cargo: {}, wins: 0, level: 1, shipLevel: 1, currentPlanet: 1,
        fuel: 100, strangePower: START_STRANGE_POWER, darkMatter: 0, hull: 100, isDead: false,
        immunityUntil: 0, hasTMHarvester: false
    };
    GOODS.forEach(g => { player.cargo[g.id] = 0; });

    let bots = [], nextBotId = 100, gameActive = false, planetStocks = [], planetPrices = [];
    let lastPriceUpdate = Date.now(), lastMissionUpdate = Date.now();
    let currentMission = null, missionCompleted = false;
    let botInterval = null, botCreationTimeout = null, lastSessionTimestamp = Date.now();
    let inDock = false, dockEntryTime = 0, dockModal = null;
    let lastKiller = null;

    // ------------------- ГЛОБАЛЬНЫЕ -------------------
    function initStocks() {
        const stocks = [];
        for (let i = 0; i < PLANET_COUNT; i++) {
            let pStocks = {};
            GOODS.forEach(g => { pStocks[g.id] = 1000; });
            stocks.push(pStocks);
        }
        return stocks;
    }
    function generatePricesForPlanet(planetIdx, timestamp) {
        const slot = Math.floor(timestamp / PRICE_REFRESH_INTERVAL_MS);
        const seed = (planetIdx * 374761393) ^ (slot * 668265263);
        const rng = (seed % 10000) / 10000;
        let prices = {};
        GOODS.forEach(g => {
            let buy = g.baseBuy + Math.floor((rng * g.spread * 2) - g.spread);
            buy = Math.max(5, buy);
            let sell = Math.min(buy, Math.max(5, buy + Math.floor((Math.random() * g.spread) - g.spread/2)));
            prices[g.id] = { buy, sell };
        });
        return prices;
    }
    function refreshPricesOnly() {
        const now = Date.now();
        const lastSlot = Math.floor(lastPriceUpdate / PRICE_REFRESH_INTERVAL_MS);
        const currentSlot = Math.floor(now / PRICE_REFRESH_INTERVAL_MS);
        if (currentSlot !== lastSlot) {
            for (let i = 0; i < PLANET_COUNT; i++) planetPrices[i] = generatePricesForPlanet(i+1, now);
            lastPriceUpdate = now;
            if (gameActive) addLogToGame("🔄 Цены на планетах обновлены.", "success");
            return true;
        }
        return false;
    }
    function getLevelFromWins(wins) { return Math.floor(wins / 7) + 1; }

    function getEffectivePower(entity) {
        let ship = getShip(entity.shipLevel);
        let basePower = ship.power;
        let rocketBonus = (entity.cargo.rockets || 0) * 0.5;
        let tmBonus = (entity.darkMatter || 0) * 0.01;
        let rawPower = basePower + rocketBonus + tmBonus;
        let hullFactor = Math.max(0, entity.hull) / 100;
        return rawPower * hullFactor;
    }

    function formatPower(power) {
        let fixed = power.toFixed(2);
        return fixed.replace(/\.?0+$/, '');
    }

    function saveGame() {
        let save = { player, bots, planetStocks, planetPrices, lastPriceUpdate, lastMissionUpdate, currentMission, missionCompleted, nextBotId, lastSessionTimestamp, inDock, dockEntryTime, lastKiller, planets };
        localStorage.setItem("starNomadFull", JSON.stringify(save));
    }
    function loadGame() {
        let raw = localStorage.getItem("starNomadFull");
        if (!raw) return false;
        try {
            let data = JSON.parse(raw);
            player = data.player; bots = data.bots; planetStocks = data.planetStocks; planetPrices = data.planetPrices;
            lastPriceUpdate = data.lastPriceUpdate; lastMissionUpdate = data.lastMissionUpdate;
            currentMission = data.currentMission; missionCompleted = data.missionCompleted; nextBotId = data.nextBotId;
            lastSessionTimestamp = data.lastSessionTimestamp || Date.now();
            inDock = data.inDock || false; dockEntryTime = data.dockEntryTime || 0; lastKiller = data.lastKiller || null;
            planets = data.planets;
            if (!planetStocks) planetStocks = initStocks();
            if (!planetPrices) { planetPrices = []; for (let i=0;i<PLANET_COUNT;i++) planetPrices[i] = generatePricesForPlanet(i+1, lastPriceUpdate); }
            if (!planets) initPlanets();
            player.level = getLevelFromWins(player.wins);
            if (player.isDead && player.hull > 0) player.isDead = false;
            return true;
        } catch(e) { return false; }
    }
    function createNewPlayerInCurrentWorld() {
        player = {
            credits: START_CREDITS, cargo: {}, wins: 0, level: 1, shipLevel: 1,
            currentPlanet: Math.floor(Math.random() * PLANET_COUNT) + 1,
            fuel: getShip(1).fuelCap, strangePower: START_STRANGE_POWER, darkMatter: 0, hull: 100,
            isDead: false, immunityUntil: Date.now() + IMMUNITY_DURATION, hasTMHarvester: false
        };
        GOODS.forEach(g => { player.cargo[g.id] = 0; });
        addLogToGame(`Новый корабль создан! Иммунитет активен на ${IMMUNITY_DURATION/60000} минут.`, "success");
        saveGame();
    }
    function resetWorldAndNewPlayer() {
        planetStocks = initStocks();
        planetPrices = [];
        for (let i=0;i<PLANET_COUNT;i++) planetPrices[i] = generatePricesForPlanet(i+1, Date.now());
        lastPriceUpdate = Date.now(); lastMissionUpdate = Date.now();
        bots = []; nextBotId = 100;
        initPlanets();
        for (let i=0;i<20;i++) createBot(1, 0);
        createNewPlayerInCurrentWorld();
        currentMission = null; missionCompleted = false;
        saveGame();
    }
    function createBot(level, wins) {
        let botsLevel1 = bots.filter(b => b.level === 1).length;
        if (level === 1 && botsLevel1 >= 20) return null;
        let shipLevel = Math.min(level, 21);
        let bot = {
            id: nextBotId++, name: `Bot-${nextBotId-1}`, credits: 2000 + Math.random() * 1000,
            cargo: {}, wins: wins, level: level, shipLevel: shipLevel,
            currentPlanet: Math.floor(Math.random() * PLANET_COUNT) + 1,
            hull: 100, darkMatter: 0, strangePower: START_STRANGE_POWER,
            fuel: getShip(shipLevel).fuelCap, lastMoveTime: Date.now(), hasTMHarvester: false,
            missionGood: null, missionQty: 0, missionTargetPlanet: null
        };
        GOODS.forEach(g => { bot.cargo[g.id] = 0; });
        for (let g of GOODS) if (Math.random() < 0.3) bot.cargo[g.id] = Math.floor(Math.random() * 10);
        bots.push(bot);
        if (gameActive) addLogToGame(`Новый бот 1 уровня появился в секторе: ${bot.name}`, "normal");
        return bot;
    }

    // ------------------- ПЛАНЕТЫ -------------------
    function getPlanet(planetIdx) { return planets[planetIdx-1]; }
    function buyPlanet(planetIdx, buyer) {
        let planet = getPlanet(planetIdx);
        let cost = 10000 + (planet.buyCount * 5000);
        if (buyer.credits < cost) return false;
        if (planet.owner !== null) {
            let owner = findEntityById(planet.owner);
            if (!owner) return false;
            if (Math.abs(buyer.level - owner.level) > 1) return false;
        }
        buyer.credits -= cost;
        planet.owner = (buyer === player ? "player" : buyer.id);
        planet.buyCount++;
        planet.modules = { teleport: false, tm: false };
        planet.income.total = 0;
        addLogToGame(`${buyer === player ? "Вы" : buyer.name} купили планету #${planetIdx} за ${cost}💰!`, "success");
        saveGame();
        return true;
    }
    function findEntityById(id) {
        if (id === "player") return player;
        return bots.find(b => b.id === id);
    }
    function addPlanetIncome(planetIdx, amount) {
        let planet = getPlanet(planetIdx);
        if (planet.owner) {
            let owner = findEntityById(planet.owner);
            if (owner) planet.income.total += amount;
        }
    }
    function collectPlanetIncome(owner) {
        let total = 0;
        for (let i = 1; i <= PLANET_COUNT; i++) {
            let p = getPlanet(i);
            if (p.owner === (owner === player ? "player" : owner.id)) {
                total += p.income.total;
                p.income.total = 0;
            }
        }
        if (total > 0) {
            owner.credits += total;
            addLogToGame(`${owner === player ? "Вы" : owner.name} собрали ${total}💰 дохода с планет!`, "success");
            saveGame();
        }
        return total;
    }
    function collectPlanetTM(owner) {
        let total = 0;
        for (let i = 1; i <= PLANET_COUNT; i++) {
            let p = getPlanet(i);
            if (p.owner === (owner === player ? "player" : owner.id) && p.modules.tm) {
                total += 10;
            }
        }
        if (total > 0) {
            owner.darkMatter += total;
            addLogToGame(`${owner === player ? "Вы" : owner.name} собрали ${total}🌑 ТМ с планет!`, "success");
            saveGame();
        }
        return total;
    }
    function installPlanetModule(planetIdx, owner, moduleType) {
        let planet = getPlanet(planetIdx);
        if (planet.owner !== (owner === player ? "player" : owner.id)) return false;
        let cost = 10000;
        if (owner.credits < cost) return false;
        if (moduleType === "teleport" && !planet.modules.teleport) {
            owner.credits -= cost;
            planet.modules.teleport = true;
            addLogToGame(`${owner === player ? "Вы" : owner.name} установили модуль телепортации на планете #${planetIdx}!`, "success");
            saveGame();
            return true;
        } else if (moduleType === "tm" && !planet.modules.tm) {
            owner.credits -= cost;
            planet.modules.tm = true;
            addLogToGame(`${owner === player ? "Вы" : owner.name} установили модуль добычи ТМ на планете #${planetIdx}!`, "success");
            saveGame();
            return true;
        }
        return false;
    }
    function teleportToPlanet(owner, targetPlanet) {
        let target = getPlanet(targetPlanet);
        if (target.owner !== (owner === player ? "player" : owner.id)) return false;
        if (!target.modules.teleport) return false;
        owner.currentPlanet = targetPlanet;
        addLogToGame(`${owner === player ? "Вы" : owner.name} телепортировались на планету #${targetPlanet}.`, "success");
        saveGame();
        return true;
    }

    // ------------------- ЗАДАНИЯ -------------------
    function generateMission() {
        if (missionCompleted) return;
        if (currentMission && !currentMission.completed) return;
        const good = GOODS[Math.floor(Math.random() * GOODS.length)];
        const qty = Math.floor(Math.random() * 41) + 10;
        let fromPlanet, toPlanet;
        do { fromPlanet = Math.floor(Math.random() * PLANET_COUNT) + 1; toPlanet = Math.floor(Math.random() * PLANET_COUNT) + 1; } while (fromPlanet === toPlanet);
        const rewardType = Math.random() < 0.5 ? "credits" : "tm";
        const rewardAmount = rewardType === "credits" ? Math.floor(Math.random() * 4001) + 1000 : Math.floor(Math.random() * 51) + 50;
        currentMission = { good: good.id, goodName: good.name, qty, fromPlanet, toPlanet, rewardType, rewardAmount, completed: false };
        missionCompleted = false;
        addLogToGame(`📡 НОВОЕ ЗАДАНИЕ: купить ${qty} ${good.name} на планете #${fromPlanet} и доставить на #${toPlanet}. Награда: ${rewardAmount} ${rewardType === "credits" ? "💰" : "🌑 ТМ"}!`, "mission");
        saveGame();
    }
    function tryCompleteMission(entity, isPlayer) {
        if (!currentMission || currentMission.completed) return false;
        if (entity.currentPlanet !== currentMission.toPlanet) return false;
        let cargoQty = entity.cargo[currentMission.good] || 0;
        if (cargoQty < currentMission.qty) return false;
        currentMission.completed = true; missionCompleted = true;
        entity.cargo[currentMission.good] -= currentMission.qty;
        if (currentMission.rewardType === "credits") {
            entity.credits += currentMission.rewardAmount;
            addLogToGame(`${isPlayer ? "Вы" : entity.name} выполнили задание! Получено ${currentMission.rewardAmount}💰.`, "success");
        } else {
            entity.darkMatter = (entity.darkMatter || 0) + currentMission.rewardAmount;
            addLogToGame(`${isPlayer ? "Вы" : entity.name} выполнили задание! Получено ${currentMission.rewardAmount}🌑 ТМ.`, "success");
        }
        if (!isPlayer) { entity.wins++; entity.level = getLevelFromWins(entity.wins); }
        saveGame();
        return true;
    }
    function botTryTakeMission(bot) {
        if (!currentMission || currentMission.completed) return false;
        if (bot.missionGood === currentMission.good && bot.missionQty > 0) return false;
        if (bot.currentPlanet !== currentMission.fromPlanet) return false;
        let good = GOODS.find(g => g.id === currentMission.good);
        if (!good) return false;
        let price = planetPrices[bot.currentPlanet-1][currentMission.good].buy;
        let totalCost = price * currentMission.qty;
        if (bot.credits < totalCost) return false;
        let cargoSpace = getShip(bot.shipLevel).cargo;
        let currentCargo = Object.values(bot.cargo).reduce((a,b)=>a+b,0);
        if (currentCargo + currentMission.qty * good.cargoSpace > cargoSpace) return false;
        bot.credits -= totalCost;
        bot.cargo[currentMission.good] = (bot.cargo[currentMission.good] || 0) + currentMission.qty;
        planetStocks[bot.currentPlanet-1][currentMission.good] -= currentMission.qty;
        bot.missionGood = currentMission.good; bot.missionQty = currentMission.qty; bot.missionTargetPlanet = currentMission.toPlanet;
        addLogToGame(`${bot.name} взял задание: купил ${currentMission.qty} ${good.name} на #${bot.currentPlanet}.`, "normal");
        saveGame();
        return true;
    }
    function updateMissionByTimer() {
        const now = Date.now();
        const lastSlot = Math.floor(lastMissionUpdate / MISSION_REFRESH_INTERVAL_MS);
        const currentSlot = Math.floor(now / MISSION_REFRESH_INTERVAL_MS);
        if (currentSlot !== lastSlot) {
            lastMissionUpdate = now;
            if (currentMission && !currentMission.completed) addLogToGame("⏰ Время выполнения задания истекло. Появляется новое.", "warning");
            currentMission = null; missionCompleted = false;
            generateMission();
            return true;
        }
        return false;
    }

    function move(delta) {
        if (player.isDead) { addLogToGame("Ваш корабль уничтожен. Начните новую игру.", "warning"); return; }
        if (inDock) { addLogToGame("Вы находитесь в доке. Сначала выйдите.", "warning"); return; }
        if (player.fuel <= 0) { addLogToGame("Нет топлива! Заправьтесь.", "warning"); return; }
        let newPlanet = player.currentPlanet + delta;
        if (newPlanet < 1) { newPlanet = 1; addLogToGame("Край сектора. Дальше планет нет.", "warning"); }
        if (newPlanet > PLANET_COUNT) { newPlanet = PLANET_COUNT; addLogToGame("Край сектора. Дальше планет нет.", "warning"); }
        if (newPlanet === player.currentPlanet) return;
        player.currentPlanet = newPlanet;
        player.fuel--; player.strangePower++;
        if (player.hasTMHarvester) { player.darkMatter++; addLogToGame(`Модуль добычи: +1 ТМ`, "success"); }
        if (Math.random() < DARK_MATTER_CHANCE) { let tm = Math.floor(Math.random()*(DARK_MATTER_AMOUNT[1]-DARK_MATTER_AMOUNT[0]+1)+DARK_MATTER_AMOUNT[0]); player.darkMatter += tm; addLogToGame(`Найдена тёмная материя! +${tm} ТМ`, "success"); }
        updateUI();
        encounterWithBots();
        tryCompleteMission(player, true);
        saveGame();
    }
    function hyperJump(direction) {
        if (player.isDead) { addLogToGame("Ваш корабль уничтожен. Начните новую игру.", "warning"); return; }
        if (inDock) { addLogToGame("Вы в доке. Сначала выйдите.", "warning"); return; }
        if (player.strangePower < HYPER_COST) { addLogToGame(`Недостаточно Силы Странника (нужно ${HYPER_COST}, у вас ${player.strangePower})`, "warning"); return; }
        let newPlanet;
        if (direction === -1) {
            if (player.currentPlanet <= 1) { addLogToGame("Вы находитесь на самой левой планете, гиперпрыжок влево невозможен.", "warning"); return; }
            newPlanet = Math.floor(Math.random() * (player.currentPlanet - 1)) + 1;
        } else {
            if (player.currentPlanet >= PLANET_COUNT) { addLogToGame("Вы находитесь на самой правой планете, гиперпрыжок вправо невозможен.", "warning"); return; }
            newPlanet = Math.floor(Math.random() * (PLANET_COUNT - player.currentPlanet)) + player.currentPlanet + 1;
        }
        player.currentPlanet = newPlanet;
        player.strangePower -= HYPER_COST;
        addLogToGame(`Гиперпрыжок! Вы оказались на планете #${player.currentPlanet}`, "success");
        updateUI();
        encounterWithBots();
        tryCompleteMission(player, true);
        saveGame();
    }

    // ------------------- БОИ -------------------
    function encounterWithBots() {
        if (inDock) return;
        let botsHere = bots.filter(b => b.currentPlanet === player.currentPlanet);
        if (botsHere.length === 0) return;
        let bot = botsHere[0];
        if (Math.abs(player.level - bot.level) > 1) {
            addLogToGame(`Вы пролетели мимо ${bot.name} (уровень ${bot.level}) — он слишком ${bot.level > player.level ? "силён" : "слаб"} для вас.`, "warning");
            return;
        }
        showCombatChoice(bot);
    }
    function showCombatChoice(bot) {
        let botCargoStr = '';
        let totalCargo = 0;
        for (let g of GOODS) { let qty = bot.cargo[g.id] || 0; if (qty > 0) { botCargoStr += `${g.name}: ${qty} `; totalCargo += qty; } }
        if (totalCargo === 0) botCargoStr = 'пусто';
        let immunityActive = (Date.now() < player.immunityUntil);
        let immunityMsg = immunityActive ? "🛡️ Иммунитет активен! Боты не атакуют вас." : "";
        let modal = document.createElement("div"); modal.className = "modal";
        modal.innerHTML = `<div class="modal-content"><h3>Встреча с ${bot.name}</h3><p>Уровень ${bot.level}, сила ${formatPower(getEffectivePower(bot))}</p>
        <p>💰 Кредиты бота: ${Math.floor(bot.credits)}</p><p>📦 Груз бота: ${botCargoStr}</p><p>Ваша сила: ${formatPower(getEffectivePower(player))}</p><p>${immunityMsg}</p>
        <div class="modal-buttons"><button id="attackBtn">⚔️ АТАКОВАТЬ</button><button id="retreatBtn">🏃 ОТСТУПИТЬ</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector("#attackBtn").onclick = () => { modal.remove(); fightWithBot(bot); };
        modal.querySelector("#retreatBtn").onclick = () => { modal.remove(); addLogToGame(`Вы отступили от ${bot.name}.`, "warning"); };
    }
    function resolveCombat(attacker, defender, isPlayerAttacker) {
        let powerA = getEffectivePower(attacker);
        let powerB = getEffectivePower(defender);
        let winnerIsAttacker = (powerA >= powerB);
        let winner = winnerIsAttacker ? attacker : defender;
        let loser = winnerIsAttacker ? defender : attacker;
        let diff = Math.abs(powerA - powerB);
        if (winner === attacker) {
            let rockets = attacker.cargo.rockets || 0;
            let rocketPower = rockets * 0.5;
            let tmPower = attacker.darkMatter * 0.01;
            let usedRockets = 0, usedTM = 0, hullDamage = 0;
            if (rocketPower >= diff) { usedRockets = Math.ceil(diff / 0.5); attacker.cargo.rockets -= usedRockets; diff = 0; }
            else { usedRockets = rockets; diff -= rocketPower; attacker.cargo.rockets = 0;
                if (tmPower >= diff) { usedTM = diff / 0.01; attacker.darkMatter -= usedTM; diff = 0; }
                else { usedTM = attacker.darkMatter; diff -= tmPower; attacker.darkMatter = 0;
                    let maxHullPower = getShip(attacker.shipLevel).power;
                    hullDamage = (diff / maxHullPower) * 100;
                    attacker.hull -= hullDamage;
                    if (attacker.hull < 0) attacker.hull = 0;
                }
            }
            if (attacker.hull <= 0) return false;
        } else {
            let rockets = defender.cargo.rockets || 0;
            let rocketPower = rockets * 0.5;
            let tmPower = defender.darkMatter * 0.01;
            let usedRockets = 0, usedTM = 0, hullDamage = 0;
            if (rocketPower >= diff) { usedRockets = Math.ceil(diff / 0.5); defender.cargo.rockets -= usedRockets; diff = 0; }
            else { usedRockets = rockets; diff -= rocketPower; defender.cargo.rockets = 0;
                if (tmPower >= diff) { usedTM = diff / 0.01; defender.darkMatter -= usedTM; diff = 0; }
                else { usedTM = defender.darkMatter; diff -= tmPower; defender.darkMatter = 0;
                    let maxHullPower = getShip(defender.shipLevel).power;
                    hullDamage = (diff / maxHullPower) * 100;
                    defender.hull -= hullDamage;
                    if (defender.hull < 0) defender.hull = 0;
                }
            }
            if (defender.hull <= 0) return false;
        }
        let stolenCredits = Math.floor(loser.credits);
        winner.credits += stolenCredits; loser.credits = 0;
        let stolenGoods = [];
        for (let g of GOODS) {
            let loserQty = loser.cargo[g.id] || 0;
            if (loserQty > 0) {
                let stealPercent = 0.1 + Math.random() * 0.2;
                let stolen = Math.floor(loserQty * stealPercent);
                if (stolen > 0) {
                    let cargoSpace = getShip(winner.shipLevel).cargo;
                    let currentCargo = Object.values(winner.cargo).reduce((a,b)=>a+b,0);
                    if (currentCargo + stolen * g.cargoSpace <= cargoSpace) {
                        winner.cargo[g.id] = (winner.cargo[g.id] || 0) + stolen; stolenGoods.push(`${g.name}: ${stolen}`);
                    } else {
                        let maxSpace = Math.floor((cargoSpace - currentCargo) / g.cargoSpace);
                        let actualStolen = Math.min(stolen, maxSpace);
                        if (actualStolen > 0) { winner.cargo[g.id] = (winner.cargo[g.id] || 0) + actualStolen; stolenGoods.push(`${g.name}: ${actualStolen}`); }
                    }
                    loser.cargo[g.id] -= stolen;
                }
            }
        }
        winner.wins = (winner.wins || 0) + 1;
        winner.level = getLevelFromWins(winner.wins);
        if (winner === player) { player.level = winner.level; addLogToGame(`Победа над ${loser.name}! Захвачено ${stolenCredits}💰 и ${stolenGoods.join(', ')}`, "combat"); }
        else { addLogToGame(`${winner.name} (ур.${winner.level}) уничтожил ${loser.name} на планете #${loser.currentPlanet}.`, "combat"); }
        if (loser !== player) bots = bots.filter(b => b.id !== loser.id);
        return winnerIsAttacker;
    }
    function fightWithBot(bot) {
        if (player.isDead) return;
        let result = resolveCombat(player, bot, true);
        if (result && player.hull > 0) { updateUI(); saveGame(); }
        else if (!result && player.hull > 0) { updateUI(); saveGame(); }
        else if (player.hull <= 0) { lastKiller = { name: bot.name, planet: player.currentPlanet, timestamp: Date.now() }; playerDefeated(); }
        updateUI(); saveGame();
    }
    function playerDefeated() {
        addLogToGame(`💀 Ваш корабль разрушен! Игра окончена.`, "combat");
        player.isDead = true;
        for (let i = 1; i <= PLANET_COUNT; i++) {
            let p = getPlanet(i);
            if (p.owner === "player") {
                p.owner = null;
                p.modules = { teleport: false, tm: false };
                p.income.total = 0;
            }
        }
        saveGame();
        if (gameActive) {
            let deathModal = document.createElement("div"); deathModal.className = "modal";
            let killerInfo = lastKiller ? `Вас уничтожил ${lastKiller.name} на планете #${lastKiller.planet} в ${new Date(lastKiller.timestamp).toLocaleString()}.` : "Причина гибели неизвестна.";
            deathModal.innerHTML = `<div class="modal-content"><h3>💀 КОРАБЛЬ УНИЧТОЖЕН</h3><p>${killerInfo}</p><p>Вы потеряли всё: корабль, груз, кредиты. Ваши планеты стали ничьими.</p><div class="modal-buttons"><button id="deathOkBtn">ПОНЯТНО</button></div></div>`;
            document.body.appendChild(deathModal);
            document.getElementById("deathOkBtn").onclick = () => {
                deathModal.remove();
                gameActive = false;
                if (botInterval) clearInterval(botInterval);
                if (botCreationTimeout) clearTimeout(botCreationTimeout);
                document.getElementById("menuScreen").style.display = "block";
                document.getElementById("gameScreen").classList.add("hidden");
                updateRanking();
                document.getElementById("continueBtn").disabled = true;
                document.getElementById("newGameBtn").disabled = false;
            };
        }
    }

    // ------------------- ИИ БОТОВ -------------------
    function botTradeAndUpgrade(bot) {
        let botShip = getShip(bot.shipLevel);
        let totalCargo = Object.values(bot.cargo).reduce((a,b)=>a+b,0);
        let planetIdx = bot.currentPlanet - 1;
        let prices = planetPrices[planetIdx];
        let stocks = planetStocks[planetIdx];
        if (bot.fuel < botShip.fuelCap && bot.credits >= (botShip.fuelCap - bot.fuel) * FUEL_PRICE) {
            let needed = botShip.fuelCap - bot.fuel; bot.credits -= needed * FUEL_PRICE; bot.fuel = botShip.fuelCap;
        }
        if (bot.hull < 100 && bot.credits >= (100 - bot.hull) * 10) {
            let needed = 100 - bot.hull; bot.credits -= needed * 10; bot.hull = 100;
        }
        if ((bot.cargo.rockets || 0) < 5 && totalCargo + 5 <= botShip.cargo && bot.credits >= prices.rockets.buy * 5 && stocks.rockets >= 5) {
            let qty = Math.min(5, Math.floor(bot.credits / prices.rockets.buy), stocks.rockets);
            if (qty > 0) { bot.credits -= qty * prices.rockets.buy; bot.cargo.rockets = (bot.cargo.rockets || 0) + qty; stocks.rockets -= qty; totalCargo += qty * 5; }
        }
        for (let g of GOODS) {
            if (prices[g.id].buy < g.baseBuy && bot.credits >= prices[g.id].buy && totalCargo + g.cargoSpace <= botShip.cargo && stocks[g.id] > 0) {
                bot.credits -= prices[g.id].buy; bot.cargo[g.id] = (bot.cargo[g.id] || 0) + 1; stocks[g.id]--; totalCargo += g.cargoSpace; break;
            }
        }
        for (let g of GOODS) {
            if (prices[g.id].sell > g.baseBuy && (bot.cargo[g.id] || 0) > 0) {
                bot.credits += prices[g.id].sell; bot.cargo[g.id]--; stocks[g.id]++; break;
            }
        }
        if (!bot.hasTMHarvester && bot.credits >= MODULE_HARVESTER_COST) { bot.credits -= MODULE_HARVESTER_COST; bot.hasTMHarvester = true; addLogToGame(`${bot.name} купил модуль добычи ТМ!`, "success"); }
        if (bot.shipLevel < bot.level && bot.credits >= getShip(bot.shipLevel+1).cost) {
            let newShip = getShip(bot.shipLevel+1); bot.credits -= newShip.cost; bot.shipLevel++;
            let fuelPercent = bot.fuel / getShip(bot.shipLevel-1).fuelCap; bot.fuel = Math.min(newShip.fuelCap, Math.floor(newShip.fuelCap * fuelPercent)); bot.hasTMHarvester = false;
            addLogToGame(`${bot.name} улучшил корабль до ${newShip.name}!`, "success");
        }
        // Боты могут покупать планеты
        if (Math.random() < 0.01 && bot.credits > 20000) {
            let targetPlanet = Math.floor(Math.random() * PLANET_COUNT) + 1;
            let planet = getPlanet(targetPlanet);
            if (planet.owner === null || (planet.owner !== bot.id && Math.abs(bot.level - findEntityById(planet.owner)?.level) <= 1)) {
                buyPlanet(targetPlanet, bot);
            }
        }
        // Боты могут устанавливать модули на свои планеты
        for (let i = 1; i <= PLANET_COUNT; i++) {
            let p = getPlanet(i);
            if (p.owner === bot.id) {
                if (!p.modules.teleport && bot.credits >= 10000 && Math.random() < 0.02) installPlanetModule(i, bot, "teleport");
                if (!p.modules.tm && bot.credits >= 10000 && Math.random() < 0.02) installPlanetModule(i, bot, "tm");
            }
        }
    }
    function botAI() {
        if (!gameActive) return;
        let planetsWithBots = new Set();
        for (let bot of bots) planetsWithBots.add(bot.currentPlanet);
        for (let planet of planetsWithBots) {
            let botsOnPlanet = bots.filter(b => b.currentPlanet === planet);
            if (botsOnPlanet.length < 2) continue;
            botsOnPlanet.sort((a,b) => getEffectivePower(b) - getEffectivePower(a));
            let attacker = botsOnPlanet[0], defender = botsOnPlanet[1];
            resolveCombat(attacker, defender, true);
        }
        for (let bot of bots) {
            if (Date.now() - (bot.lastMoveTime||0) >= BOT_MOVE_INTERVAL_MS) {
                if (!player.isDead && !inDock && player.currentPlanet === bot.currentPlanet) {
                    let immunityActive = (Date.now() < player.immunityUntil);
                    if (!immunityActive) {
                        let playerPower = getEffectivePower(player);
                        let botPower = getEffectivePower(bot);
                        if (botPower > playerPower * 0.8 && bot.hull > 50) {
                            addLogToGame(`${bot.name} атакует вас!`, "combat");
                            fightWithBot(bot);
                            if (!bots.find(b => b.id === bot.id)) continue;
                        } else {
                            let dir = Math.random() < 0.5 ? -1 : 1;
                            let newPlanet = bot.currentPlanet + dir;
                            if (newPlanet < 1) newPlanet = 1; if (newPlanet > PLANET_COUNT) newPlanet = PLANET_COUNT;
                            if (newPlanet !== bot.currentPlanet) { bot.currentPlanet = newPlanet; addLogToGame(`${bot.name} отступил на планету #${newPlanet}.`, "warning"); }
                        }
                    } else {
                        let dir = Math.random() < 0.5 ? -1 : 1;
                        let newPlanet = bot.currentPlanet + dir;
                        if (newPlanet < 1) newPlanet = 1; if (newPlanet > PLANET_COUNT) newPlanet = PLANET_COUNT;
                        if (newPlanet !== bot.currentPlanet) { bot.currentPlanet = newPlanet; addLogToGame(`${bot.name} видит ваш иммунитет и улетает.`, "normal"); }
                    }
                }
                let dir = Math.random() < 0.5 ? -1 : 1;
                let newPlanet = bot.currentPlanet + dir;
                if (newPlanet < 1) newPlanet = 1; if (newPlanet > PLANET_COUNT) newPlanet = PLANET_COUNT;
                if (newPlanet !== bot.currentPlanet) bot.currentPlanet = newPlanet;
                bot.lastMoveTime = Date.now();
                if (Math.random() < DARK_MATTER_CHANCE) { let tm = Math.floor(Math.random()*(DARK_MATTER_AMOUNT[1]-DARK_MATTER_AMOUNT[0]+1)+DARK_MATTER_AMOUNT[0]); bot.darkMatter += tm; }
                if (bot.hasTMHarvester) bot.darkMatter++;
                botTradeAndUpgrade(bot);
                tryCompleteMission(bot, false);
                botTryTakeMission(bot);
                let newLevel = getLevelFromWins(bot.wins);
                if (newLevel > bot.level) bot.level = newLevel;
            }
        }
        saveGame();
    }

    // Симуляция пропущенного времени (до 12 часов)
    function simulateTimePassed(ms) {
        if (ms <= 0) return;
        let maxMs = MAX_OFFLINE_HOURS * 60 * 60 * 1000;
        if (ms > maxMs) ms = maxMs;
        let steps = Math.min(Math.floor(ms / 10000), 5000);
        for (let i = 0; i < steps; i++) {
            for (let bot of bots) {
                let dir = Math.random() < 0.5 ? -1 : 1;
                let newPlanet = bot.currentPlanet + dir;
                if (newPlanet < 1) newPlanet = 1; if (newPlanet > PLANET_COUNT) newPlanet = PLANET_COUNT;
                if (newPlanet !== bot.currentPlanet) bot.currentPlanet = newPlanet;
                if (Math.random() < DARK_MATTER_CHANCE) { let tm = Math.floor(Math.random()*(DARK_MATTER_AMOUNT[1]-DARK_MATTER_AMOUNT[0]+1)+DARK_MATTER_AMOUNT[0]); bot.darkMatter += tm; }
                if (bot.hasTMHarvester) bot.darkMatter++;
                botTradeAndUpgrade(bot);
                let botsOnPlanet = bots.filter(b => b.currentPlanet === bot.currentPlanet);
                if (botsOnPlanet.length > 1) { botsOnPlanet.sort((a,b) => getEffectivePower(b) - getEffectivePower(a)); resolveCombat(botsOnPlanet[0], botsOnPlanet[1], true); }
                tryCompleteMission(bot, false);
                botTryTakeMission(bot);
            }
            if ((i * 10000) % PRICE_REFRESH_INTERVAL_MS < 10000) refreshPricesOnly();
            if ((i * 10000) % BOT_CREATE_INTERVAL_MS < 10000) {
                let level1Count = bots.filter(b => b.level === 1).length;
                if (level1Count < 20) createBot(1, 0);
            }
            if ((i * 10000) % MISSION_REFRESH_INTERVAL_MS < 10000) updateMissionByTimer();
        }
        saveGame();
    }

    // ------------------- РЕЙТИНГ (ТАБЛИЦА НА РУССКОМ) -------------------
    function updateRanking() {
        let all = [
            { name: "⭐ ВЫ", level: player.level, power: getEffectivePower(player), wins: player.wins },
            ...bots.map(b => ({ name: b.name, level: b.level, power: getEffectivePower(b), wins: b.wins }))
        ];
        all.sort((a,b) => b.level - a.level || b.wins - a.wins);

            html += `<tr><td>${p.name}</td><td>${p.level}</td><td>${formatPower(p.power)}</td><td>${p.wins}</td></tr>`;
        }
        html += `</tbody></table><p>Всего ботов: ${bots.length}</p>`;
        document.getElementById("rankingList").innerHTML = html;
    }

    // ------------------- ЭКСПОРТ/ИМПОРТ -------------------
    function exportSave() {
        let saveData = localStorage.getItem("starNomadFull");
        if (!saveData) { alert("Нет сохранения для экспорта."); return; }
        let blob = new Blob([saveData], {type: "application/json"});
        let url = URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = "star_nomad_save.json";
        a.click();
        URL.revokeObjectURL(url);
        alert("Сохранение экспортировано в файл star_nomad_save.json");
    }
    function importSave() {
        let input = document.createElement("input");
        input.type = "file";
        input.accept = "application/json";
        input.onchange = (e) => {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    let data = JSON.parse(ev.target.result);
                    localStorage.setItem("starNomadFull", JSON.stringify(data));
                    alert("Сохранение импортировано. Перезагрузите страницу для применения.");
                    location.reload();
                } catch (err) {
                    alert("Ошибка при импорте: неверный формат файла.");
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    // ------------------- ЗАПУСК -------------------
    function startGame() {
        const now = Date.now();
        const elapsed = now - lastSessionTimestamp;
        if (elapsed > 0) {
            let hours = Math.floor(elapsed / (60*60*1000));
            if (hours > MAX_OFFLINE_HOURS) hours = MAX_OFFLINE_HOURS;
            addLogToGame(`⏳ Прошло ${hours} ч ${Math.floor((elapsed % (60*60*1000)) / (60*1000))} мин. Обновляю мир...`, "normal");
            simulateTimePassed(elapsed);
        }
        lastSessionTimestamp = now; saveGame();
        document.getElementById("menuScreen").style.display = "none";
        document.getElementById("gameScreen").classList.remove("hidden");
        gameActive = true;
        updateUI();
        startBotAI();
        scheduleBotCreation();
        setInterval(() => { if (gameActive) refreshPricesOnly(); }, 60000);
        setInterval(() => { if (gameActive) updateMissionByTimer(); }, 60000);
        setInterval(() => {
            if (gameActive && player.immunityUntil && Date.now() > player.immunityUntil && player.immunityUntil !== 0) {
                addLogToGame("🛡️ Иммунитет закончился! Теперь боты могут вас атаковать.", "warning");
                player.immunityUntil = 0; saveGame();
            }
            if (inDock && Date.now() - dockEntryTime >= DOCK_DURATION_MS) { addLogToGame("⚠️ Время пребывания в доке истекло. Вас выдворили в космос.", "warning"); exitDock(); }
        }, 60000);
        if (inDock && !player.isDead) showDockUI();
    }
    function startBotAI() { if (botInterval) clearInterval(botInterval); botInterval = setInterval(botAI, 5000); }
    function scheduleBotCreation() { if (botCreationTimeout) clearTimeout(botCreationTimeout); botCreationTimeout = setTimeout(() => { let level1Count = bots.filter(b => b.level === 1).length; if (level1Count < 20) createBot(1, 0); scheduleBotCreation(); }, BOT_CREATE_INTERVAL_MS); }

    window.onload = () => {
        if (!loadGame()) resetWorldAndNewPlayer();
        const now = Date.now(); const elapsed = now - lastSessionTimestamp;
        if (elapsed > 0 && elapsed < MAX_OFFLINE_HOURS*60*60*1000) simulateTimePassed(elapsed);
        lastSessionTimestamp = now; saveGame();
        document.getElementById("continueBtn").disabled = player.isDead;
        document.getElementById("newGameBtn").disabled = !player.isDead;
        document.getElementById("continueBtn").onclick = () => { if (player.isDead) return; startGame(); };
        document.getElementById("newGameBtn").onclick = () => {
            if (!player.isDead) { alert("У вас уже есть корабль! Новая игра доступна только после гибели."); return; }
            createNewPlayerInCurrentWorld(); player.isDead = false;
            document.getElementById("continueBtn").disabled = false; document.getElementById("newGameBtn").disabled = true;
            addLogToGame("Новый корабль создан в этом же секторе.", "success");
            updateRanking();
            if (gameActive) { gameActive = false; if (botInterval) clearInterval(botInterval); if (botCreationTimeout) clearTimeout(botCreationTimeout); document.getElementById("menuScreen").style.display = "block"; document.getElementById("gameScreen").classList.add("hidden"); }
        };
        document.getElementById("shopBtn").onclick = () => openShipShopInMenu();
        document.getElementById("rankingBtn").onclick = () => { let panel = document.getElementById("rankingPanel"); panel.classList.toggle("hidden"); updateRanking(); };
        document.getElementById("exportBtn").onclick = () => exportSave();
        document.getElementById("importBtn").onclick = () => importSave();
        document.getElementById("exitBtn").onclick = () => { saveGame(); alert("Игра сохранена."); };
        document.getElementById("leftBtn").onclick = () => move(-1);
        document.getElementById("rightBtn").onclick = () => move(1);
        document.getElementById("hyperLeftBtn").onclick = () => hyperJump(-1);
        document.getElementById("hyperRightBtn").onclick = () => hyperJump(1);
        document.getElementById("dockBtn").onclick = () => enterDock();
        document.getElementById("menuBtn").onclick = () => {
            gameActive = false; if (botInterval) clearInterval(botInterval); if (botCreationTimeout) clearTimeout(botCreationTimeout);
            document.getElementById("menuScreen").style.display = "block";
            document.getElementById("gameScreen").classList.add("hidden");
            updateRanking();
            document.getElementById("continueBtn").disabled = player.isDead;
            document.getElementById("newGameBtn").disabled = !player.isDead;
            lastSessionTimestamp = Date.now(); saveGame();
        };
        document.getElementById("currentPlanetCard").onclick = () => {
            if (player.isDead) { addLogToGame("Ваш корабль уничтожен. Начните новую игру.", "warning"); return; }
            if (inDock) { addLogToGame("Вы в доке. Планета недоступна.", "warning"); return; }
            openPlanetMenu(player.currentPlanet);
        };
        document.getElementById("menuScreen").style.display = "block";
        updateRanking();
        setInterval(() => { let rankingPanel = document.getElementById("rankingPanel"); if (rankingPanel && !rankingPanel.classList.contains("hidden")) updateRanking(); }, 10000);
        if (!currentMission && !missionCompleted) generateMission();

        window.addEventListener("beforeunload", () => saveGame());
    };
</script>
</body>
</html>
